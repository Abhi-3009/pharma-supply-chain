# Ansible Inventory File
# Define target hosts for deployment

[k8s_master]
# Replace with your Kubernetes master node IP/hostname
# For Minikube local setup:
localhost ansible_connection=local

# For remote VM setup (uncomment and configure):
# k8s-master ansible_host=192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[k8s_workers]
# k8s-worker-1 ansible_host=192.168.1.101 ansible_user=ubuntu
# k8s-worker-2 ansible_host=192.168.1.102 ansible_user=ubuntu

[all:vars]
ansible_python_interpreter=/usr/bin/python3
