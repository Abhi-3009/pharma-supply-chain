sonar.projectKey=pharma-supply-chain
sonar.projectName=Pharma Supply Chain
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/logs/**,**/coverage/**,**/public/**,**/db/seed.js,**/db/migrations.js
sonar.coverage.exclusions=**/public/**,**/db/seed.js,**/db/migrations.js

# Test coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
