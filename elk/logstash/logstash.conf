# Logstash Pipeline Configuration
# Receives JSON logs from the Pharma Supply Chain application
# and forwards them to Elasticsearch for indexing.

input {
  # TCP input — receives logs from Winston (Node.js app)
  tcp {
    port => 5000
    codec => json_lines
    type => "pharma-app"
  }

  # Beats input — for Filebeat if used
  beats {
    port => 5044
  }
}

filter {
  # Parse JSON logs from the application
  if [type] == "pharma-app" {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }

    # Extract important fields
    if [parsed] {
      mutate {
        add_field => {
          "app_service" => "%{[parsed][service]}"
          "log_level" => "%{[parsed][level]}"
          "log_message" => "%{[parsed][message]}"
        }
      }
    }

    # Add timestamp
    date {
      match => ["[parsed][timestamp]", "YYYY-MM-dd HH:mm:ss", "ISO8601"]
      target => "@timestamp"
    }

    # Add geolocation if IP is present (optional)
    if [parsed][ip] {
      geoip {
        source => "[parsed][ip]"
        target => "geoip"
      }
    }
  }

  # Remove redundant fields
  mutate {
    remove_field => ["host", "port"]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "pharma-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # Also output to stdout for debugging (remove in production)
  stdout {
    codec => rubydebug
  }
}
